<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Nova 简历编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M16 7l2.4 6.6L25 16l-6.6 2.4L16 25l-2.4-6.6L7 16l6.6-2.4L16 7Z' fill='%23fff'/%3E%3C/svg%3E" />

<!-- ============ 简历纸张样式（导出 HTML 时原样带走） ============ -->
<style id="resume-css">
@page { size: A4; margin: 0; }

.paper,
.paper * { box-sizing: border-box; }

.paper {
  --paper-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --base-size: 14px;
  --line-height: 1.65;
  --letter-spacing: 0px;
  --ink: #1f2937;
  --accent: #4f46e5;
  --pad-y: 15mm;
  --pad-x: 18mm;

  width: 210mm;
  min-height: 297mm;
  margin: 0 auto;
  padding: var(--pad-y) var(--pad-x);
  background: #fff;
  color: var(--ink);
  font-family: var(--paper-font);
  font-size: var(--base-size);
  line-height: var(--line-height);
  letter-spacing: var(--letter-spacing);
  overflow-wrap: break-word;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.resume-head {
  padding-bottom: 0.95em;
  margin-bottom: 1.05em;
  border-bottom: 2px solid var(--accent);
}
.name {
  margin: 0;
  font-size: 1.95em;
  font-weight: 700;
  line-height: 1.18;
  letter-spacing: 0.01em;
}
.headline {
  margin: 0.32em 0 0;
  font-size: 1.03em;
  font-weight: 500;
  opacity: 0.82;
}
.contact {
  margin: 0.45em 0 0;
  font-size: 0.85em;
  letter-spacing: 0.01em;
  opacity: 0.64;
}

.section { position: relative; margin-top: 1.05em; }
.resume-head + .section { margin-top: 0; }

.section-title {
  position: relative;
  margin: 0 0 0.55em;
  padding-left: 0.72em;
  font-size: 1.05em;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.section-title::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.16em;
  bottom: 0.16em;
  width: 3px;
  border-radius: 2px;
  background: var(--accent);
}

.section-body > p { margin: 0; }

.entry { position: relative; }
.entry + .entry { margin-top: 0.95em; }
.entry-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1em;
}
.entry-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 1em;
  font-weight: 600;
}
.entry-meta {
  font-size: 0.84em;
  letter-spacing: 0.01em;
  opacity: 0.62;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.entry-sub {
  margin: 0.18em 0 0;
  font-size: 0.9em;
  opacity: 0.72;
}

.bullets {
  margin: 0.3em 0 0;
  padding: 0;
  list-style: none;
}
.bullets li {
  position: relative;
  margin: 0.18em 0;
  padding-left: 1.1em;
}
.bullets li::before {
  content: "";
  position: absolute;
  left: 0.16em;
  top: 0.68em;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.8;
}

/* 商务：标题下划线 */
.paper[data-template="business"] .section-title {
  padding-left: 0;
  padding-bottom: 0.26em;
  border-bottom: 2px solid var(--accent);
  letter-spacing: 0.1em;
}
.paper[data-template="business"] .section-title::before { display: none; }

/* 学术：居中抬头 + 衬线分隔 */
.paper[data-template="academic"] .resume-head {
  text-align: center;
  border-bottom-color: rgba(31, 41, 55, 0.28);
}
.paper[data-template="academic"] .name { letter-spacing: 0.12em; }
.paper[data-template="academic"] .section-title {
  padding-left: 0;
  padding-bottom: 0.22em;
  border-bottom: 1px solid rgba(31, 41, 55, 0.22);
  letter-spacing: 0.16em;
}
.paper[data-template="academic"] .section-title::before { display: none; }

@media print {
  .paper {
    min-height: 0;
    margin: 0 auto;
    box-shadow: none !important;
    border-radius: 0 !important;
  }
  .entry,
  .bullets li { break-inside: avoid; }
  .section-title { break-after: avoid; }
}
</style>

<!-- ============ 编辑器外壳样式 ============ -->
<style id="editor-css">
:root {
  --panel-w: 344px;
  --primary: #4f46e5;
  --primary-600: #4338ca;
  --primary-50: #eef2ff;
  --border: #e6e9f0;
  --muted: #64748b;
  --chrome-bg: #eef1f7;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--chrome-bg);
  color: #0f172a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }
.icon {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- 顶栏 ---------- */
.app { height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: relative;
  z-index: 40;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 60px;
  padding: 0 18px 0 20px;
  background: #fff;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: inherit; text-decoration: none; border-radius: 8px; }
.brand:hover .brand-name { color: var(--primary); }
.brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  color: #fff;
  background: linear-gradient(135deg, #6366f1, #4338ca);
  box-shadow: 0 7px 16px -7px rgba(79, 70, 229, 0.7);
}
.brand-mark .icon { width: 18px; height: 18px; }
.brand-text { min-width: 0; }
.brand-name { display: block; font-size: 14px; font-weight: 750; line-height: 1.2; letter-spacing: 0.01em; }
.brand-sub { display: block; margin-top: 1px; font-size: 10.5px; color: var(--muted); }
.save-state {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 4px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
}
.save-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
  transition: background 0.2s;
}
.save-state.is-saving .save-dot { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.14); }
.save-state.is-error .save-dot { background: #e11d48; box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.14); }
.save-state.is-error { color: #be123c; }
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 7px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #fff;
  color: #334155;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.1s;
}
.btn:hover { background: #f8fafc; border-color: #d8dde8; }
.btn:active { transform: translateY(0.5px); }
.btn.icon-only { width: 34px; padding: 0; }
.btn.primary {
  border-color: transparent;
  color: #fff;
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  box-shadow: 0 7px 16px -8px rgba(79, 70, 229, 0.85);
}
.btn.primary:hover { filter: brightness(1.04); background: linear-gradient(135deg, #6366f1, #4f46e5); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: #f1f5f9; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: 0.38; cursor: default; pointer-events: none; }
.btn-group { display: flex; gap: 5px; }
.sep { width: 1px; height: 22px; background: var(--border); }
.style-toggle { display: none; }

/* 下拉菜单 */
.menu-wrap { position: relative; }
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  z-index: 90;
  min-width: 208px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 20px 44px -18px rgba(15, 23, 42, 0.28);
}
.menu button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: none;
  text-align: left;
}
.menu button:hover { background: #f5f7fb; }
.menu-title { font-size: 12.5px; font-weight: 600; }
.menu-desc { font-size: 10.5px; color: var(--muted); }
.menu-sep { height: 1px; margin: 5px 4px; background: var(--border); }

/* ---------- 工作区 ---------- */
.workspace { flex: 1; min-height: 0; display: flex; }
.stage {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: 34px 28px 84px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-image: radial-gradient(#d7ddea 1px, transparent 1px);
  background-size: 18px 18px;
  background-position: -9px -9px;
  scrollbar-gutter: stable;
}
.paper-holder { display: flex; justify-content: center; width: 100%; }
.paper {
  position: relative;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 28px 64px -28px rgba(15, 23, 42, 0.32);
  border-radius: 2px;
}
.stage-hint {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 18px;
  margin-top: 16px;
  font-size: 11.5px;
  color: #94a3b8;
}
.stage-hint span { display: inline-flex; align-items: center; gap: 6px; }
.stage-hint span::before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #cbd5e1;
}

/* 编辑态提示 */
[data-role][contenteditable="true"] {
  border-radius: 3px;
  outline: none;
  transition: background-color 0.12s, box-shadow 0.12s;
}
@media (hover: hover) {
  .paper [data-role][contenteditable="true"]:hover {
    background: rgba(99, 102, 241, 0.055);
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
}
.paper [data-role][contenteditable="true"]:focus,
.paper [data-role].is-current {
  background: rgba(99, 102, 241, 0.075);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);
}
.paper [data-role][contenteditable="true"]:empty::after {
  content: attr(data-placeholder);
  color: var(--ink);
  opacity: 0.3;
  font-weight: 400;
  font-style: normal;
  pointer-events: none;
}

/* 悬浮工具条 */
.section-tools,
.entry-tools {
  position: absolute;
  z-index: 6;
  display: flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 8px 22px -12px rgba(15, 23, 42, 0.4);
  opacity: 0;
  transform: translateY(2px);
  pointer-events: none;
  transition: opacity 0.14s, transform 0.14s;
}
.section-tools { top: -10px; right: -14px; }
.entry-tools {
  top: -4px;
  right: auto;
  left: -36px;
  flex-direction: column;
}
.section:hover > .section-tools,
.section:focus-within > .section-tools,
.entry:hover > .entry-tools,
.entry:focus-within > .entry-tools {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}
.mini-btn {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  color: #94a3b8;
}
.mini-btn:hover { background: #f1f5f9; color: #334155; }
.mini-btn.danger:hover { background: #fef2f2; color: #e11d48; }
.mini-btn.add { color: var(--accent); }
.mini-btn.add:hover {
  background: rgba(99, 102, 241, 0.08);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
}
.mini-btn .icon { width: 13px; height: 13px; }

.flash { animation: flash-block 1.1s ease-out; }
@keyframes flash-block {
  0%, 100% { background: transparent; }
  25% { background: color-mix(in srgb, var(--accent) 16%, transparent); }
}

/* ---------- 缩放条 ---------- */
.zoombar {
  position: fixed;
  right: calc(var(--panel-w) + 20px);
  bottom: 18px;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 1px;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 12px 30px -18px rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(8px);
}
.zoombar button {
  height: 28px;
  min-width: 28px;
  padding: 0 6px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: #475569;
  font-size: 14px;
  font-weight: 600;
}
.zoombar button:hover { background: #f1f5f9; }
.zoombar .zoom-label { min-width: 48px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.zoombar .zoom-sep { width: 1px; height: 16px; margin: 0 3px; background: var(--border); }
.zoombar .zoom-fit { font-size: 11.5px; padding: 0 9px; }

/* ---------- 右侧面板 ---------- */
.panel {
  flex: none;
  display: flex;
  flex-direction: column;
  width: var(--panel-w);
  min-height: 0;
  border-left: 1px solid var(--border);
  background: #fff;
}
.panel-head { position: relative; flex: none; padding: 12px 14px 0; border-bottom: 1px solid var(--border); }
.tabs { display: flex; gap: 2px; }
.tab {
  flex: 1;
  padding: 9px 6px 10px;
  border: 0;
  border-radius: 8px 8px 0 0;
  background: none;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  position: relative;
}
.tab:hover { color: #0f172a; background: #f8fafc; }
.tab.is-active { color: var(--primary); }
.tab.is-active::after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--primary);
}
.panel-close {
  display: none;
  position: absolute;
  top: 12px;
  right: 10px;
  width: 30px;
  height: 30px;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--muted);
}
.panel-close:hover { background: #f1f5f9; color: #0f172a; }
.panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 26px;
  overscroll-behavior: contain;
}
.panel-foot {
  flex: none;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.65;
}

.group { margin-bottom: 20px; }
.group:last-child { margin-bottom: 4px; }
.group-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 9px;
  color: #94a3b8;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.field { margin-bottom: 11px; }
.field:last-child { margin-bottom: 0; }
.field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
  color: #475569;
  font-size: 12px;
  font-weight: 600;
}
.field-value { color: var(--primary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.font-chips {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.font-chip {
  padding: 5px 4px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  color: #64748b;
  font-size: 12px;
  line-height: 1.25;
  text-align: center;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.font-chip:hover {
  color: var(--primary);
  border-color: #c7d2fe;
  background: #eef2ff;
}
.font-chip.is-active {
  color: var(--primary);
  border-color: var(--primary);
  background: #eef2ff;
  font-weight: 600;
}
.font-hint {
  margin: 7px 0 0;
  color: #94a3b8;
  font-size: 11px;
  line-height: 1.55;
}
select,
input[type="text"],
input[type="number"] {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  font-size: 12.5px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
select:focus,
input[type="text"]:focus,
input[type="number"]:focus {
  border-color: #a5b4fc;
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}
input[type="range"] { width: 100%; height: 18px; accent-color: var(--primary); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.field-grid .field { margin-bottom: 0; }
.number-unit { position: relative; }
.number-unit input { padding-right: 30px; }
.number-unit span {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 11px;
  pointer-events: none;
}
.color-row { display: flex; align-items: center; gap: 8px; }
input[type="color"] {
  width: 34px;
  height: 34px;
  flex: none;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
}
.color-hex {
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
}
.segmented {
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 9px;
  background: #f1f5f9;
}
.segmented button {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 4px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: #64748b;
  font-size: 11.5px;
  font-weight: 600;
}
.segmented button:hover { color: #334155; }
.segmented button.is-active { background: #fff; color: var(--primary); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); }
.segmented .icon { width: 14px; height: 14px; }
.link-btn {
  border: 0;
  background: none;
  padding: 0;
  color: var(--primary);
  font-size: 11px;
  font-weight: 600;
}
.link-btn:hover { text-decoration: underline; }

/* 模板卡片 */
.templates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.template-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 8px 6px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: #475569;
  font-size: 11.5px;
  font-weight: 600;
  transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
}
.template-card:hover { border-color: #c7d2fe; }
.template-card.is-active { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.12); }
.template-preview {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
  height: 44px;
  padding: 0 13px;
  border: 1px solid #eef2f7;
  border-radius: 6px;
  background: #f8fafc;
}
.template-preview i { display: block; height: 3px; border-radius: 2px; background: #94a3b8; }
.template-preview i:nth-child(1) { width: 58%; height: 5px; background: #475569; }
.template-preview i:nth-child(2) { width: 100%; }
.template-preview i:nth-child(3) { width: 76%; }
.tpl-business .template-preview i:nth-child(1) { background: #0f766e; }
.tpl-business .template-preview i:nth-child(2) { background: #5eead4; }
.tpl-academic .template-preview i { background: #9a3412; }
.tpl-academic .template-preview i:nth-child(1) { background: #7c2d12; }

/* 当前段落 */
.current-block {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding: 9px 10px;
  border: 1px solid #e0e7ff;
  border-radius: 9px;
  background: var(--primary-50);
}
.role-pill {
  flex: none;
  padding: 2px 6px;
  border-radius: 5px;
  background: #fff;
  color: var(--primary);
  font-size: 10px;
  font-weight: 700;
}
.block-preview {
  min-width: 0;
  overflow: hidden;
  color: #64748b;
  font-size: 11px;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.empty-state {
  padding: 42px 18px;
  color: #94a3b8;
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
}
.empty-state .icon { width: 30px; height: 30px; margin-bottom: 10px; color: #cbd5e1; }
.tip-card {
  padding: 9px 10px;
  border: 1px dashed #dbe2ee;
  border-radius: 8px;
  background: #fafbfe;
  color: #7c8aa5;
  font-size: 10.5px;
  line-height: 1.7;
}

/* 添加模块 */
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.add-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #fff;
  color: #475569;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.add-card:hover { border-color: #c7d2fe; background: #f8faff; color: var(--primary); }
.add-card .icon { width: 15px; height: 15px; color: #94a3b8; }
.add-card:hover .icon { color: var(--primary); }

/* 模块列表 */
.module-list { display: flex; flex-direction: column; gap: 6px; }
.module-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #fff;
}
.module-index {
  flex: none;
  width: 18px;
  color: #b6c0d0;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.module-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  border: 0;
  background: none;
  color: #334155;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.module-name:hover { color: var(--primary); }
.module-tools { display: flex; gap: 1px; }

/* ---------- 遮罩 / 提示 ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: rgba(15, 23, 42, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.overlay.is-show { opacity: 1; pointer-events: auto; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  z-index: 120;
  padding: 9px 15px;
  border-radius: 10px;
  background: #0f172a;
  color: #fff;
  font-size: 12px;
  box-shadow: 0 16px 36px -18px rgba(15, 23, 42, 0.7);
  opacity: 0;
  transform: translate(-50%, 10px);
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

/* 滚动条 */
.panel-scroll::-webkit-scrollbar,
.stage::-webkit-scrollbar { width: 10px; height: 10px; }
.panel-scroll::-webkit-scrollbar-track,
.stage::-webkit-scrollbar-track { background: transparent; }
.panel-scroll::-webkit-scrollbar-thumb,
.stage::-webkit-scrollbar-thumb {
  border: 3px solid transparent;
  border-radius: 10px;
  background: #cbd5e1;
  background-clip: content-box;
}
.panel-scroll::-webkit-scrollbar-thumb:hover,
.stage::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: content-box; }

@media (min-width: 1181px) {
  .overlay { display: none; }
}

@media (max-width: 1180px) {
  .style-toggle { display: inline-flex; }
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    width: min(360px, 92vw);
    height: 100vh;
    border-left: 1px solid var(--border);
    box-shadow: -24px 0 60px -30px rgba(15, 23, 42, 0.4);
    transform: translateX(102%);
    transition: transform 0.24s ease;
  }
  .panel.is-open { transform: none; }
  .panel-close { display: grid; }
  .panel-head { padding-right: 46px; }
  .zoombar { right: 20px; }
}

@media (max-width: 900px) {
  .topbar { gap: 9px; padding: 0 12px; }
  .brand-sub, .save-state { display: none; }
  .stage { padding: 22px 14px 78px; }
  .btn .btn-label { display: none; }
  .btn { width: 34px; padding: 0; }
  .btn.primary { width: auto; padding: 0 11px; }
  .btn.primary .btn-label { display: inline; }
  .topbar-actions { gap: 5px; }
  .zoombar { bottom: 12px; }
}

@media (max-width: 560px) {
  .brand-name { font-size: 13px; }
  .topbar-actions .btn.primary .btn-label { display: none; }
  .topbar-actions .btn.primary { width: 34px; }
  .stage-hint { display: none; }
  .zoombar { right: 12px; }
}

/* ---------- 打印 ---------- */
@media print {
  html, body {
    height: auto !important;
    overflow: visible !important;
    background: #fff !important;
  }
  .topbar, .panel, .overlay, .zoombar, .stage-hint, .toast { display: none !important; }
  .app, .workspace, .stage { display: block !important; height: auto !important; min-height: 0 !important; overflow: visible !important; padding: 0 !important; background: none !important; }
  .paper-holder { display: block !important; width: auto !important; }
  .paper { zoom: 1 !important; margin: 0 auto !important; box-shadow: none !important; border-radius: 0 !important; }
  [data-ui] { display: none !important; }
  .paper [data-role][contenteditable="true"] { background: transparent !important; box-shadow: none !important; }
  .paper [data-role][contenteditable="true"]:empty::after { content: none !important; }
}

/* ---------- 嵌入 Nova 工作台（?embed=1）----------
   挂进侧栏后左边已经有品牌与导航，这里去掉重复的 brand，顶栏压扁到 52px。 */
.embed .topbar {
  height: 52px;
  padding: 0 14px;
}
.embed .brand { display: none; }
.embed .save-state { margin-left: 2px; }
</style>
</head>
<body>
<script>
  // ?embed=1  被工作台 iframe 内嵌：去掉重复品牌、压扁顶栏
  // ?standalone=1  保留旧的单页入口；其余情况跳回 React 路由，避免两套入口
  ;(() => {
    const params = new URLSearchParams(location.search)
    if (params.has('embed')) {
      document.documentElement.classList.add('embed')
      return
    }
    if (!params.has('standalone') && location.protocol.startsWith('http')) {
      location.replace('/resume-editor' + location.hash)
    }
  })()
</script>

<div class="app">

  function icon(id, cls) {
    return '<svg class="icon ' + (cls || '') + '" aria-hidden="true"><use href="#' + id + '"></use></svg>';
  }

  function clampNumber(value, min, max, fallback) {
    var n = Number(value);
    if (!isFinite(n)) { return fallback; }
    return Math.min(max, Math.max(min, n));
  }

  function round(value, digits) {
    var factor = Math.pow(10, digits || 0);
    return Math.round(value * factor) / factor;
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function validColor(value, fallback) {
    var text = String(value || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(text)) { return text.toLowerCase(); }
    if (/^#[0-9a-f]{3}$/i.test(text)) {
      return ('#' + text[1] + text[1] + text[2] + text[2] + text[3] + text[3]).toLowerCase();
    }
    return fallback;
  }

  function rgbToHex(value) {
    var nums = String(value || '').match(/[\d.]+/g);
    if (!nums || nums.length < 3) { return '#000000'; }
    return '#' + nums.slice(0, 3).map(function (n) {
      var v = Math.max(0, Math.min(255, Math.round(Number(n))));
      return v.toString(16).padStart(2, '0');
    }).join('');
  }

  function normalizeGlobal(input) {
    var out = {};
    Object.keys(DEFAULT_GLOBAL).forEach(function (key) { out[key] = DEFAULT_GLOBAL[key]; });
    if (input && typeof input === 'object') {
      Object.keys(input).forEach(function (key) {
        if (Object.prototype.hasOwnProperty.call(out, key)) { out[key] = input[key]; }
      });
    }
    if (!FONTS[out.font]) { out.font = DEFAULT_GLOBAL.font; }
    if (!PADS[out.pad]) { out.pad = DEFAULT_GLOBAL.pad; }
    if (!TEMPLATES[out.template]) { out.template = DEFAULT_GLOBAL.template; }
    out.fontSize = clampNumber(out.fontSize, 10, 24, DEFAULT_GLOBAL.fontSize);
    out.lineHeight = clampNumber(out.lineHeight, 1.1, 2.6, DEFAULT_GLOBAL.lineHeight);
    out.letterSpacing = clampNumber(out.letterSpacing, -1, 3, 0);
    out.ink = validColor(out.ink, DEFAULT_GLOBAL.ink);
    out.accent = validColor(out.accent, DEFAULT_GLOBAL.accent);
    return out;
  }

  function toast(message) {
    var el = $('toast');
    el.textContent = message;
    el.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-show'); }, 2200);
  }

  function isMobilePanel() {
    return window.matchMedia('(max-width: 1180px)').matches;
  }

  /* ================================================================
   * 应用全局排版
   * ================================================================ */
  function applyGlobal() {
    var pad = PADS[styleState.pad] || PADS.normal;
    paper.style.setProperty('--paper-font', FONTS[styleState.font].stack);
    paper.style.setProperty('--base-size', styleState.fontSize + 'px');
    paper.style.setProperty('--line-height', String(styleState.lineHeight));
    paper.style.setProperty('--letter-spacing', styleState.letterSpacing + 'px');
    paper.style.setProperty('--ink', styleState.ink);
    paper.style.setProperty('--accent', styleState.accent);
    paper.style.setProperty('--pad-y', pad.y);
    paper.style.setProperty('--pad-x', pad.x);
    paper.dataset.template = styleState.template || 'simple';
  }

  function syncGlobalControls() {
    $('fontSelect').value = styleState.font;
    $('fontSize').value = styleState.fontSize;
    $('fontSizeVal').textContent = round(styleState.fontSize, 1) + ' px';
    $('lineHeight').value = styleState.lineHeight;
    $('lineHeightVal').textContent = round(styleState.lineHeight, 2);
    $('letterSpacing').value = styleState.letterSpacing;
    $('letterSpacingVal').textContent = (styleState.letterSpacing > 0 ? '+' : '') + round(styleState.letterSpacing, 2) + ' px';
    $('inkColor').value = styleState.ink;
    $('inkHex').textContent = styleState.ink.toUpperCase();
    $('accentColor').value = styleState.accent;
    $('accentHex').textContent = styleState.accent.toUpperCase();

    Array.prototype.forEach.call($('padSeg').querySelectorAll('button'), function (btn) {
      btn.classList.toggle('is-active', btn.dataset.pad === styleState.pad);
    });
    Array.prototype.forEach.call($('fontChips').querySelectorAll('button'), function (btn) {
      btn.classList.toggle('is-active', btn.dataset.font === styleState.font);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.template-card'), function (card) {
      card.classList.toggle('is-active', card.dataset.template === styleState.template);
    });
  }

  function setGlobal(patch, immediate) {
    styleState = normalizeGlobal(Object.assign({}, styleState, patch));
    applyGlobal();
    syncGlobalControls();
    if (currentBlock) { syncBlockPanel(); }
    if (immediate) {
      commitHistory();
      saveNow();
    } else {
      markDirty();
    }
  }

  function applyTemplate(name) {
    var preset = TEMPLATES[name];
    if (!preset) { return; }
    Array.prototype.forEach.call(paper.querySelectorAll('[data-role]'), function (el) {
      el.removeAttribute('style');
    });
    styleState = normalizeGlobal(Object.assign({}, DEFAULT_GLOBAL, preset));
    applyGlobal();
    syncGlobalControls();
    syncBlockPanel();
    commitHistory();
    saveNow();
    toast('已应用「' + preset.label + '」模板');
  }

  /* ================================================================
   * 加载 / 序列化
   * ================================================================ */
  function cleanHTML() {
    var clone = paper.cloneNode(true);
    clone.querySelectorAll('[data-ui]').forEach(function (node) { node.remove(); });
    clone.querySelectorAll('.is-current').forEach(function (node) { node.classList.remove('is-current'); });
    clone.querySelectorAll('[contenteditable]').forEach(function (node) {
      node.removeAttribute('contenteditable');
      node.removeAttribute('spellcheck');
    });
    clone.querySelectorAll('[data-placeholder]').forEach(function (node) {
      node.removeAttribute('data-placeholder');
    });
    return clone.innerHTML;
  }

   * 纯文本视图，用于回写后端。
   * 不用 innerText：它会把编辑器的装饰节点也带上，而且依赖布局信息。
   * 要点前面带 "- "，后端文本解析器认这个前缀，能还原成列表。
   */
  function resumePlainText() {
    var lines = [];
    var text = function (node) { return node ? (node.textContent || '').replace(/\s+/g, ' ').trim() : ''; };
    ['.name', '.headline', '.contact'].forEach(function (selector) {
      var value = text(paper.querySelector('[data-role="' + selector.slice(1) + '"]'));
      if (value) { lines.push(value); }
    });
    paper.querySelectorAll('.section').forEach(function (section) {
      var title = text(section.querySelector('.section-title'));
      if (title) { lines.push(''); lines.push(title); }
      var entries = section.querySelectorAll('.entry');
      if (entries.length) {
        entries.forEach(function (entry) {
          var head = [text(entry.querySelector('[data-role="entry-title"]')), text(entry.querySelector('[data-role="entry-meta"]'))]
            .filter(Boolean).join('  ');
          if (head) { lines.push(head); }
          var sub = text(entry.querySelector('[data-role="entry-sub"]'));
          if (sub) { lines.push(sub); }
          entry.querySelectorAll('[data-role="bullet"]').forEach(function (item) {
            var value = text(item);
            if (value) { lines.push('- ' + value); }
          });
        });
      } else {
        section.querySelectorAll('[data-role="paragraph"]').forEach(function (node) {
          var value = text(node);
          if (value) { lines.push(value); }
        });
        section.querySelectorAll('[data-role="bullet"]').forEach(function (node) {
          var value = text(node);
          if (value) { lines.push('- ' + value); }
        });
      }
    });
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function buildState() {
    return {
      app: 'nova-resume-editor',
      version: 1,
      savedAt: new Date().toISOString(),
      global: JSON.parse(JSON.stringify(styleState)),
      html: cleanHTML()
    };
  }

  function sanitizeHTML(html) {
    var tpl = document.createElement('template');
    tpl.innerHTML = String(html || '');
    tpl.content.querySelectorAll('script, style, iframe, object, embed, link, meta, form, input, textarea, select, button, svg').forEach(function (node) {
      node.remove();
    });
    tpl.content.querySelectorAll('*').forEach(function (el) {
      Array.prototype.slice.call(el.attributes).forEach(function (attr) {
        var name = attr.name.toLowerCase();
        var value = String(attr.value || '');
        if (name.indexOf('on') === 0 || name === 'srcdoc' || name === 'contenteditable' || name === 'spellcheck' || name === 'data-eid' || name === 'data-placeholder') {
          el.removeAttribute(attr.name);
          return;
        }
        if ((name === 'href' || name === 'src' || name === 'xlink:href') && /^\s*(javascript|data):/i.test(value)) {
          el.removeAttribute(attr.name);
        }
      });
    });
    return tpl.innerHTML;
  }

  function scanEids() {
    eidCounter = 0;
    paper.querySelectorAll('[data-eid]').forEach(function (el) {
      var n = parseInt(String(el.dataset.eid || '').slice(1), 10);
      if (!isNaN(n) && n > eidCounter) { eidCounter = n; }
    });
  }

  function loadSaved() {
    try {
      var raw = localStorage.getItem(activeKey);
      if (!raw) { return null; }
      var data = JSON.parse(raw);
      if (!data || typeof data.html !== 'string') { return null; }
      return data;
    } catch (err) {
      return null;
    }
  }

  function applyDocument(doc, options) {
    var opts = options || {};
    paper.innerHTML = sanitizeHTML(doc && doc.html ? doc.html : DEFAULT_HTML);
    styleState = normalizeGlobal(doc && doc.global ? doc.global : DEFAULT_GLOBAL);
    currentBlock = null;
    scanEids();
    applyGlobal();
    enhancePaper();
    syncGlobalControls();
    syncBlockPanel();
    updateDocTitle();
    if (opts.resetHistory) {
      undoStack = [];
      undoIndex = -1;
      commitHistory();
    }
  }

  /* ================================================================
   * 增强：可编辑 / 悬浮工具 / 添加按钮
   * ================================================================ */
  function enhancePaper() {
    paper.querySelectorAll('[data-role]').forEach(function (el) {
      if (el.getAttribute('contenteditable') !== 'true') {
        el.setAttribute('contenteditable', 'true');
      }
      el.setAttribute('spellcheck', 'false');
      if (!el.dataset.placeholder) {
        el.dataset.placeholder = PLACEHOLDERS[el.dataset.role] || '点击输入';
      }
      if (!el.dataset.eid) {
        eidCounter += 1;
        el.dataset.eid = 'e' + eidCounter;
      }
    });
    paper.querySelectorAll('.section').forEach(decorateSection);
    updateModuleList();
    updateDocTitle();
  }

  function decorateSection(section) {
    var body = section.querySelector(':scope > .section-body');
    var addAct = '';
    var addTitle = '';

    if (body) {
      var entries = body.querySelectorAll(':scope > .entry');
      if (entries.length || ENTRY_TYPES[section.dataset.sectionType]) {
        entries.forEach(decorateEntry);
        addAct = 'add-entry';
        addTitle = ADD_ENTRY_LABELS[section.dataset.sectionType] || '添加一条';
      } else if (body.querySelector(':scope > .bullets')) {
        addAct = 'add-bullet';
        addTitle = '添加要点';
      }
    }

    if (!section.querySelector(':scope > .section-tools')) {
      var tools = document.createElement('div');
      tools.className = 'section-tools';
      tools.dataset.ui = '1';
      tools.setAttribute('contenteditable', 'false');
      tools.innerHTML =
        (addAct
          ? '<button type="button" class="mini-btn add" data-act="' + addAct + '" title="' + addTitle + '" aria-label="' + addTitle + '">' + icon('i-plus') + '</button>'
          : '') +
        '<button type="button" class="mini-btn" data-act="section-up" title="上移模块" aria-label="上移模块">' + icon('i-up') + '</button>' +
        '<button type="button" class="mini-btn" data-act="section-down" title="下移模块" aria-label="下移模块">' + icon('i-down') + '</button>' +
        '<button type="button" class="mini-btn danger" data-act="section-delete" title="删除模块（可撤销）" aria-label="删除模块">' + icon('i-trash') + '</button>';
      section.appendChild(tools);
    }
  }

  function decorateEntry(entry) {
    if (entry.querySelector(':scope > .entry-tools')) { return; }
    var tools = document.createElement('div');
    tools.className = 'entry-tools';
    tools.dataset.ui = '1';
    tools.setAttribute('contenteditable', 'false');
    tools.innerHTML =
      '<button type="button" class="mini-btn" data-act="entry-up" title="上移这条" aria-label="上移这条">' + icon('i-up') + '</button>' +
      '<button type="button" class="mini-btn" data-act="entry-down" title="下移这条" aria-label="下移这条">' + icon('i-down') + '</button>' +
      '<button type="button" class="mini-btn danger" data-act="entry-delete" title="删除这条（可撤销）" aria-label="删除这条">' + icon('i-trash') + '</button>';
    entry.appendChild(tools);
  }

  /* ================================================================
   * 段落样式
   * ================================================================ */
  function setCurrentBlock(el) {
    if (currentBlock && currentBlock !== el) {
      currentBlock.classList.remove('is-current');
    }
    currentBlock = el;
    if (el) { el.classList.add('is-current'); }
    syncBlockPanel();
    if (el && !suppressAutoTab && !isMobilePanel() && activeTab === 'global') {
      setTab('block');
    }
  }

  function setBlockStyle(prop, value) {
    if (!currentBlock) { return; }
    if (value === '' || value === null || value === undefined) {
      currentBlock.style.removeProperty(prop);
    } else {
      currentBlock.style.setProperty(prop, value);
    }
    syncBlockPanel();
    markDirty();
  }

  function matchFontKey(stack) {
    var first = String(stack || '').split(',')[0].replace(/["']/g, '').trim().toLowerCase();
    var keys = Object.keys(FONTS);
    for (var i = 0; i < keys.length; i += 1) {
      var fontFirst = FONTS[keys[i]].stack.split(',')[0].replace(/["']/g, '').trim().toLowerCase();
      if (fontFirst === first) { return keys[i]; }
    }
    return '';
  }

  function syncBlockPanel() {
    var el = currentBlock && currentBlock.isConnected ? currentBlock : null;
    currentBlock = el;
    $('blockEmpty').hidden = !!el;
    $('blockEditor').hidden = !el;
    if (!el) { return; }

    $('blockRole').textContent = ROLE_LABELS[el.dataset.role] || '正文';
    $('blockPreview').textContent = (el.textContent || '').trim().slice(0, 30) || '空白段落';

    var cs = window.getComputedStyle(el);
    $('blockFont').value = el.style.fontFamily ? (matchFontKey(el.style.fontFamily) || '') : '';
    $('blockSize').value = round(parseFloat(cs.fontSize) || styleState.fontSize, 1);
    $('blockWeight').value = String(Math.min(700, Math.max(300, Math.round(parseFloat(cs.fontWeight) / 100) * 100)));
    $('blockLineHeight').value = round(cs.lineHeight === 'normal' ? styleState.lineHeight : (parseFloat(cs.lineHeight) / (parseFloat(cs.fontSize) || styleState.fontSize)), 2);
    $('blockLetterSpacing').value = round(parseFloat(cs.letterSpacing) || 0, 2);
    $('blockColor').value = rgbToHex(cs.color);
    $('blockColorHex').textContent = rgbToHex(cs.color).toUpperCase();

    Array.prototype.forEach.call($('blockItalic').querySelectorAll('button'), function (btn) {
      btn.classList.toggle('is-active', btn.dataset.italic === (cs.fontStyle === 'italic' ? 'italic' : 'normal'));
    });

    var align = cs.textAlign;
    if (align === 'start') { align = 'left'; }
    if (align === 'end') { align = 'right'; }
    if (align !== 'center' && align !== 'right') { align = 'left'; }
    Array.prototype.forEach.call($('blockAlign').querySelectorAll('button'), function (btn) {
      btn.classList.toggle('is-active', btn.dataset.align === align);
    });
  }

  /* ================================================================
   * 历史记录
   * ================================================================ */
  function commitHistory() {
    var html = cleanHTML();
    var globalCopy = JSON.parse(JSON.stringify(styleState));
    var sig = html + '|' + JSON.stringify(globalCopy);
    if (undoIndex >= 0 && undoStack[undoIndex] && undoStack[undoIndex].sig === sig) { return; }
    undoStack = undoStack.slice(0, undoIndex + 1);
    undoStack.push({ sig: sig, html: html, global: globalCopy });
    if (undoStack.length > MAX_HISTORY) { undoStack.shift(); }
    undoIndex = undoStack.length - 1;
    updateHistoryButtons();
  }

  function flushCommit() {
    clearTimeout(commitTimer);
    commitTimer = 0;
    commitHistory();
  }

  function updateHistoryButtons() {
    $('undoBtn').disabled = undoIndex <= 0;
    $('redoBtn').disabled = undoIndex >= undoStack.length - 1;
  }

  function captureCaret() {
    var el = document.activeElement;
    if (!el || !paper.contains(el)) { return null; }
    var block = el.closest ? el.closest('[data-role]') : null;
    if (!block) { return null; }
    return { eid: block.dataset.eid, offset: caretOffset(block) };
  }

  function restoreCaret(caret) {
    if (!caret) { return; }
    var el = paper.querySelector('[data-eid="' + caret.eid + '"]');
    if (!el) { return; }
    setCurrentBlock(el);
    focusAt(el, caret.offset, true);
  }

  function applyHistory(index) {
    var entry = undoStack[index];
    if (!entry) { return; }
    var caret = captureCaret();
    undoIndex = index;
    paper.innerHTML = entry.html;
    styleState = normalizeGlobal(entry.global);
    currentBlock = null;
    scanEids();
    applyGlobal();
    enhancePaper();
    syncGlobalControls();
    syncBlockPanel();
    updateHistoryButtons();
    updateDocTitle();
    restoreCaret(caret);
    saveNow();
  }

  function undo() {
    flushCommit();
    if (undoIndex <= 0) { return; }
    applyHistory(undoIndex - 1);
  }

  function redo() {
    if (undoIndex >= undoStack.length - 1) { return; }
    applyHistory(undoIndex + 1);
  }

  /* ================================================================
   * 保存
   * ================================================================ */
  function setSaveState(kind) {
    var wrap = $('saveState');
    wrap.classList.toggle('is-saving', kind === 'saving');
    wrap.classList.toggle('is-error', kind === 'error');
    if (kind === 'saving') {
      $('saveText').textContent = '保存中…';
    } else if (kind === 'error') {
      $('saveText').textContent = '本机保存失败，请导出备份';
    } else {
      var time = new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
      $('saveText').textContent = '已自动保存 ' + time;
    }
  }

  function saveNow() {
    try {
      localStorage.setItem(activeKey, JSON.stringify(buildState()));
      setSaveState('saved');
    } catch (err) {
      setSaveState('error');
    }
  }

  function markDirty() {
    setSaveState('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 500);
    clearTimeout(commitTimer);
    commitTimer = setTimeout(commitHistory, 750);
  }

  /* ================================================================
   * 文档标题 / 文件名
   * ================================================================ */
  function resumeName() {
    var el = paper.querySelector('[data-role="name"]');
    var text = (el && el.textContent ? el.textContent : '').trim();
    if (!text) { return '我的简历'; }
    return text.replace(/[\\/:*?"<>|\r\n]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40) || '我的简历';
  }

  function updateDocTitle() {
    document.title = resumeName() + ' · Nova 简历编辑器';
  }

  /* ================================================================
   * 模块列表
   * ================================================================ */
  function updateModuleList() {
    var list = $('moduleList');
    if (!list) { return; }
    var sections = Array.prototype.slice.call(paper.querySelectorAll('.section'));
    list.innerHTML = '';
    sections.forEach(function (section, index) {
      var titleEl = section.querySelector('.section-title');
      var name = (titleEl && titleEl.textContent ? titleEl.textContent : '').trim() || '未命名模块';

      var row = document.createElement('div');
      row.className = 'module-row';
      row.dataset.index = String(index);

      var idx = document.createElement('span');
      idx.className = 'module-index';
      idx.textContent = String(index + 1).padStart(2, '0');

      var nameBtn = document.createElement('button');
      nameBtn.type = 'button';
      nameBtn.className = 'module-name';
      nameBtn.textContent = name;
      nameBtn.title = '定位到这个模块';
      nameBtn.dataset.ma = 'focus';
      nameBtn.dataset.index = String(index);

      var tools = document.createElement('div');
      tools.className = 'module-tools';
      tools.innerHTML =
        '<button type="button" class="mini-btn" data-ma="up" data-index="' + index + '" title="上移">' + icon('i-up') + '</button>' +
        '<button type="button" class="mini-btn" data-ma="down" data-index="' + index + '" title="下移">' + icon('i-down') + '</button>' +
        '<button type="button" class="mini-btn danger" data-ma="delete" data-index="' + index + '" title="删除">' + icon('i-trash') + '</button>';

      row.appendChild(idx);
      row.appendChild(nameBtn);
      row.appendChild(tools);
      list.appendChild(row);
    });
    $('moduleCount').textContent = String(sections.length);
  }

  function focusSection(index) {
    var sections = paper.querySelectorAll('.section');
    var section = sections[index];
    if (!section) { return; }
    var titleEl = section.querySelector('.section-title');
    if (!titleEl) { return; }
    section.scrollIntoView({ behavior: 'smooth', block: 'center' });
    titleEl.classList.add('flash');
    setTimeout(function () { titleEl.classList.remove('flash'); }, 1150);
    suppressAutoTab = true;
    focusAt(titleEl, (titleEl.textContent || '').length);
    suppressAutoTab = false;
    if (isMobilePanel()) { closePanel(); } else { setTab('block'); }
  }

  /* ================================================================
   * 代码块 / 模块模板
   * ================================================================ */
  function entryMarkup() {
    return [
      '<div class="entry">',
      '  <div class="entry-head">',
      '    <div class="entry-title" data-role="entry-title"></div>',
      '    <div class="entry-meta" data-role="entry-meta"></div>',
      '  </div>',
      '  <p class="entry-sub" data-role="entry-sub"></p>',
      '  <ul class="bullets"><li data-role="bullet"></li></ul>',
      '</div>'
    ].join('');
  }

  function createSectionMarkup(type) {
    var typeInfo = ADD_TYPES.filter(function (item) { return item.type === type; })[0] || ADD_TYPES[7];
    var title = typeInfo.title;
    var body;
    if (ENTRY_TYPES[type]) {
      body = entryMarkup();
    } else if (BULLET_TYPES[type]) {
      body = '<ul class="bullets"><li data-role="bullet"></li></ul>';
    } else {
      body = '<p data-role="paragraph"></p>';
    }
    return '<section class="section" data-section-type="' + type + '">' +
      '<h2 class="section-title" data-role="section-title">' + title + '</h2>' +
      '<div class="section-body">' + body + '</div>' +
      '</section>';
  }

  /* ================================================================
   * 模块 / 条目操作
   * ================================================================ */
  function addSection(type) {
    flushCommit();
    var holder = document.createElement('div');
    holder.innerHTML = createSectionMarkup(type);
    var section = holder.firstElementChild;
    paper.appendChild(section);
    enhancePaper();
    var titleEl = section.querySelector('.section-title');
    suppressAutoTab = true;
    setCurrentBlock(titleEl);
    focusAt(titleEl, (titleEl.textContent || '').length);
    suppressAutoTab = false;
    section.scrollIntoView({ behavior: 'smooth', block: 'center' });
    commitHistory();
    saveNow();
    toast('已添加模块，可直接修改标题');
  }

  function moveSection(section, direction) {
    flushCommit();
    var sections = Array.prototype.slice.call(paper.querySelectorAll('.section'));
    var index = sections.indexOf(section);
    var target = index + direction;
    if (index < 0 || target < 0 || target >= sections.length) { return; }
    if (direction < 0) {
      paper.insertBefore(section, sections[target]);
    } else {
      paper.insertBefore(sections[target], section);
    }
    updateModuleList();
    commitHistory();
    saveNow();
  }

  function deleteSection(section) {
    flushCommit();
    var title = section.querySelector('.section-title');
    var label = title ? (title.textContent || '').trim() : '模块';
    if (currentBlock && section.contains(currentBlock)) {
      currentBlock.classList.remove('is-current');
      currentBlock = null;
      syncBlockPanel();
    }
    section.remove();
    enhancePaper();
    commitHistory();
    saveNow();
    toast('已删除「' + (label || '模块') + '」，可撤销');
  }

  function addEntry(section) {
    flushCommit();
    var body = section.querySelector(':scope > .section-body');
    if (!body) { return; }
    var holder = document.createElement('div');
    holder.innerHTML = entryMarkup();
    var entry = holder.firstElementChild;
    body.appendChild(entry);
    enhancePaper();
    var titleEl = entry.querySelector('[data-role="entry-title"]');
    suppressAutoTab = true;
    setCurrentBlock(titleEl);
    focusAt(titleEl, 0);
    suppressAutoTab = false;
    entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    commitHistory();
    saveNow();
  }

  function moveEntry(entry, direction) {
    flushCommit();
    var siblings = Array.prototype.slice.call(entry.parentElement.querySelectorAll(':scope > .entry'));
    var index = siblings.indexOf(entry);
    var target = index + direction;
    if (index < 0 || target < 0 || target >= siblings.length) { return; }
    if (direction < 0) {
      entry.parentElement.insertBefore(entry, siblings[target]);
    } else {
      entry.parentElement.insertBefore(siblings[target], entry);
    }
    commitHistory();
    saveNow();
  }

  function deleteEntry(entry) {
    flushCommit();
    if (currentBlock && entry.contains(currentBlock)) {
      currentBlock.classList.remove('is-current');
      currentBlock = null;
      syncBlockPanel();
    }
    entry.remove();
    enhancePaper();
    commitHistory();
    saveNow();
    toast('已删除这条经历，可撤销');
  }

  function addBullet(section) {
    flushCommit();
    var ul = section.querySelector('.bullets');
    if (!ul) {
      var body = section.querySelector('.section-body');
      if (!body) { return; }
      ul = document.createElement('ul');
      ul.className = 'bullets';
      body.appendChild(ul);
    }
    var li = document.createElement('li');
    li.dataset.role = 'bullet';
    ul.appendChild(li);
    enhancePaper();
    suppressAutoTab = true;
    setCurrentBlock(li);
    focusAt(li, 0);
    suppressAutoTab = false;
    li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    commitHistory();
    saveNow();
  }

  function handlePaperAction(act, btn) {
    var section = btn.closest('.section');
    if (act === 'section-up' && section) { moveSection(section, -1); return; }
    if (act === 'section-down' && section) { moveSection(section, 1); return; }
    if (act === 'section-delete' && section) { deleteSection(section); return; }
    if (act === 'add-entry' && section) { addEntry(section); return; }
    if (act === 'add-bullet' && section) { addBullet(section); return; }

    var entry = btn.closest('.entry');
    if (act === 'entry-up' && entry) { moveEntry(entry, -1); return; }
    if (act === 'entry-down' && entry) { moveEntry(entry, 1); return; }
    if (act === 'entry-delete' && entry) { deleteEntry(entry); return; }
  }

  /* ================================================================
   * 光标工具
   * ================================================================ */
  function caretOffset(el) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || !el.contains(sel.anchorNode) || !el.contains(sel.endContainer)) {
      return (el.textContent || '').length;
    }
    var range = sel.getRangeAt(0).cloneRange();
    var pre = document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.endContainer, range.endOffset);
    return pre.toString().length;
  }

  function focusAt(el, offset, preventScroll) {
    if (!el) { return; }
    el.focus({ preventScroll: !!preventScroll });
    var sel = window.getSelection();
    if (!sel) { return; }
    var range = document.createRange();
    var total = (el.textContent || '').length;
    var target = Math.max(0, Math.min(typeof offset === 'number' ? offset : total, total));
    var remaining = target;
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var node;
    var placed = false;
    while ((node = walker.nextNode())) {
      var len = node.nodeValue ? node.nodeValue.length : 0;
      if (remaining <= len) {
        range.setStart(node, remaining);
        range.collapse(true);
        placed = true;
        break;
      }
      remaining -= len;
    }
    if (!placed) {
      range.selectNodeContents(el);
      range.collapse(false);
    }
    sel.removeAllRanges();
    sel.addRange(range);
    if (!preventScroll) { el.scrollIntoView({ block: 'nearest' }); }
  }

  function focusNextEditable(el, backwards) {
    var all = Array.prototype.slice.call(paper.querySelectorAll('[data-role]')).filter(function (node) {
      return node.offsetParent !== null;
    });
    var index = all.indexOf(el);
    if (index < 0) { return; }
    var next = all[index + (backwards ? -1 : 1)];
    if (!next) { return; }
    focusAt(next, (next.textContent || '').length);
  }

  /* ================================================================
   * 正文交互
   * ================================================================ */
  paper.addEventListener('focusin', handleEditableFocus);
  paper.addEventListener('focus', handleEditableFocus, true);

  function handleEditableFocus(event) {
    var el = event.target.closest ? event.target.closest('[data-role]') : null;
    if (!el || !paper.contains(el)) { return; }
    setCurrentBlock(el);
  }

  paper.addEventListener('input', function (event) {
    var el = event.target.closest ? event.target.closest('[data-role]') : null;
    if (!el) { return; }
    if (el === currentBlock) {
      $('blockPreview').textContent = (el.textContent || '').trim().slice(0, 30) || '空白段落';
    }
    if (el.dataset.role === 'section-title') { updateModuleList(); }
    if (el.dataset.role === 'name') { updateDocTitle(); }
    markDirty();
  });

  paper.addEventListener('click', function (event) {
    var btn = event.target.closest ? event.target.closest('button[data-act]') : null;
    if (btn && paper.contains(btn)) {
      event.preventDefault();
      event.stopPropagation();
      handlePaperAction(btn.dataset.act, btn);
      return;
    }
    var el = event.target.closest ? event.target.closest('[data-role]') : null;
    if (el && paper.contains(el)) { setCurrentBlock(el); }
  });

  paper.addEventListener('keydown', function (event) {
    if (event.isComposing) { return; }
    var el = event.target.closest ? event.target.closest('[data-role]') : null;
    if (!el) { return; }

    if (event.key === 'Enter' && event.shiftKey) {
      event.preventDefault();
      document.execCommand('insertLineBreak');
      markDirty();
      return;
    }

    if (event.key === 'Enter') {
      event.preventDefault();
      if (el.dataset.role === 'bullet') {
        var li = document.createElement('li');
        li.dataset.role = 'bullet';
        el.after(li);
        enhancePaper();
        suppressAutoTab = true;
        setCurrentBlock(li);
        focusAt(li, 0);
        suppressAutoTab = false;
        markDirty();
      } else {
        el.blur();
      }
      return;
    }

    if (event.key === 'Backspace' && el.dataset.role === 'bullet' && !(el.textContent || '').trim()) {
      event.preventDefault();
      var prev = el.previousElementSibling;
      var sectionEl = el.closest('.section');
      el.remove();
      if (prev) {
        focusAt(prev, (prev.textContent || '').length);
      } else if (sectionEl) {
        var titleEl = sectionEl.querySelector('.section-title');
        if (titleEl) { focusAt(titleEl, (titleEl.textContent || '').length); }
      }
      markDirty();
      return;
    }

    if (event.key === 'Tab') {
      var all = Array.prototype.slice.call(paper.querySelectorAll('[data-role]')).filter(function (node) {
        return node.offsetParent !== null;
      });
      var index = all.indexOf(el);
      var next = all[index + (event.shiftKey ? -1 : 1)];
      if (next) {
        event.preventDefault();
        focusAt(next, (next.textContent || '').length);
      }
    }
  });

  paper.addEventListener('paste', function (event) {
    var el = event.target.closest ? event.target.closest('[data-role]') : null;
    if (!el) { return; }
    event.preventDefault();
    var clip = event.clipboardData;
    if (!clip) { return; }
    var text = String(clip.getData('text/plain') || '').replace(/\r\n?/g, '\n').trim();
    if (!text) { return; }

    if (el.dataset.role === 'bullet' && text.indexOf('\n') >= 0) {
      var lines = text.split(/\n+/).map(function (line) { return line.replace(/^\s*[-*•·]\s*/, '').trim(); }).filter(Boolean);
      if (lines.length > 1) {
        document.execCommand('insertText', false, lines[0]);
        var last = el;
        lines.slice(1).forEach(function (line) {
          var li = document.createElement('li');
          li.dataset.role = 'bullet';
          li.textContent = line;
          last.after(li);
          last = li;
        });
        enhancePaper();
        markDirty();
        return;
      }
    }

    document.execCommand('insertText', false, text.replace(/\s*\n+\s*/g, ' '));
    markDirty();
  });

  /* ================================================================
   * 面板 tab / 移动端抽屉
   * ================================================================ */
  function setTab(name) {
    if (['global', 'block', 'modules'].indexOf(name) < 0) { name = 'global'; }
    activeTab = name;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
      var active = tab.dataset.tab === name;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.panel-page'), function (page) {
      page.hidden = page.dataset.page !== name;
    });
    if (name === 'block') { syncBlockPanel(); }
    if (name === 'modules') { updateModuleList(); }
  }

  function openPanel() {
    panel.classList.add('is-open');
    overlay.classList.add('is-show');
  }

  function closePanel() {
    panel.classList.remove('is-open');
    overlay.classList.remove('is-show');
  }

  function closeMenu() {
    exportMenu.hidden = true;
    $('exportMenuBtn').setAttribute('aria-expanded', 'false');
  }

  /* ================================================================
   * 缩放
   * ================================================================ */
  function applyZoom(value) {
    zoomValue = round(clampNumber(value, 0.4, 1.6, 1), 2);
    paper.style.zoom = zoomValue;
    $('zoomLabel').textContent = Math.round(zoomValue * 100) + '%';
  }

  function fitZoom() {
    var available = Math.max(320, stage.clientWidth - 56);
    applyZoom(Math.min(1, available / 793.7));
  }

  function setZoomMode(mode) {
    zoomMode = mode;
    if (mode === 'fit') {
      fitZoom();
    }
  }

  /* ================================================================
   * 导入 / 导出
   * ================================================================ */
  function download(text, filename, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
  }

  function exportJSON() {
    var data = buildState();
    download(JSON.stringify(data, null, 2), resumeName() + '-简历备份.json', 'application/json;charset=utf-8');
    toast('已导出 JSON 备份');
  }

  function exportClone() {
    var clone = paper.cloneNode(true);
    clone.querySelectorAll('[data-ui]').forEach(function (node) { node.remove(); });
    clone.querySelectorAll('.bullets li').forEach(function (li) {
      if (!(li.textContent || '').trim()) { li.remove(); }
    });
    ['entry-meta', 'entry-sub', 'paragraph'].forEach(function (role) {
      clone.querySelectorAll('[data-role="' + role + '"]:empty').forEach(function (node) { node.remove(); });
    });
    clone.querySelectorAll('[contenteditable]').forEach(function (node) {
      node.removeAttribute('contenteditable');
      node.removeAttribute('spellcheck');
    });
    clone.querySelectorAll('[data-eid], [data-placeholder]').forEach(function (node) {
      node.removeAttribute('data-eid');
      node.removeAttribute('data-placeholder');
    });
    clone.querySelectorAll('.is-current').forEach(function (node) { node.classList.remove('is-current'); });
    clone.removeAttribute('id');
    clone.style.removeProperty('zoom');
    return clone;
  }

  function exportHTML() {
    var clone = exportClone();
    var css = $('resume-css').textContent;
    var name = escapeHTML(resumeName());
    var html = [
      '<!doctype html>',
      '<html lang="zh-CN">',
      '<head>',
      '<meta charset="UTF-8" />',
      '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
      '<title>' + name + ' - 简历</title>',
      '<style>',
      css,
      'html, body { margin: 0; padding: 0; background: #eef1f7; }',
      'body { display: flex; justify-content: center; padding: 28px 16px; min-height: 100vh; }',
      '.paper { box-shadow: 0 24px 60px -28px rgba(15, 23, 42, 0.32); }',
      '@media print { html, body { background: #fff; } body { padding: 0; display: block; min-height: 0; } .paper { box-shadow: none !important; border-radius: 0 !important; margin: 0 auto; } }',
      '</style>',
      '</head>',
      '<body>',
      clone.outerHTML,
      '</body>',
      '</html>'
    ].join('\n');
    download(html, resumeName() + '-简历.html', 'text/html;charset=utf-8');
    toast('已导出单文件 HTML');
  }

  function exportPDF() {
    closeMenu();
    saveNow();
    if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
    window.print();
  }

  function importData(data) {
    if (!data || typeof data !== 'object' || typeof data.html !== 'string') {
      throw new Error('文件里没有简历内容');
    }
    flushCommit();
    applyDocument(data, { resetHistory: false });
    commitHistory();
    saveNow();
    toast('已导入简历数据');
  }

  function resetToDemo() {
    if (!window.confirm('重置为示例简历？当前内容会保留在撤销历史中。')) { return; }
    flushCommit();
    applyDocument({ html: DEFAULT_HTML, global: DEFAULT_GLOBAL }, { resetHistory: false });
    commitHistory();
    saveNow();
    toast('已重置为示例简历');
  }

  /* ================================================================
   * 控件绑定
   * ================================================================ */
  function fontOptionsHTML() {
    var html = '<option value="system" style="font-family:' + FONTS.system.stack.replace(/"/g, "'") + '">' + FONTS.system.label + '</option>';
    ['常用中文字体', '更多中文字体', '西文字体'].forEach(function (group) {
      var items = Object.keys(FONTS).filter(function (key) {
        return FONTS[key].group === group;
      }).map(function (key) {
        var font = FONTS[key];
        return '<option value="' + key + '" style="font-family:' + font.stack.replace(/"/g, "'") + '">' + font.label + '</option>';
      }).join('');
      if (items) { html += '<optgroup label="' + group + '">' + items + '</optgroup>'; }
    });
    return html;
  }

  function renderFontChips() {
    $('fontChips').innerHTML = FONT_CHIPS.map(function (item) {
      var font = FONTS[item.key];
      return '<button type="button" class="font-chip" data-font="' + item.key + '" style="font-family:' + font.stack.replace(/"/g, "'") + '">' + item.label + '</button>';
    }).join('');
  }

  function populateFontSelects() {
    var options = fontOptionsHTML();
    $('fontSelect').innerHTML = options;
    $('blockFont').innerHTML = '<option value="">跟随全文</option>' + options;
    renderFontChips();
  }

  function renderAddGrid() {
    $('addGrid').innerHTML = ADD_TYPES.map(function (item) {
      return '<button type="button" class="add-card" data-add="' + item.type + '">' + icon(item.icon) + '<span>' + item.label + '</span></button>';
    }).join('');
  }

  function bindChrome() {
    $('undoBtn').addEventListener('click', undo);
    $('redoBtn').addEventListener('click', redo);

    $('fontSelect').addEventListener('change', function (event) { setGlobal({ font: event.target.value }, true); });
    $('fontChips').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-font]');
      if (!btn) { return; }
      setGlobal({ font: btn.dataset.font }, true);
    });
    $('fontSize').addEventListener('input', function (event) { setGlobal({ fontSize: Number(event.target.value) }); });
    $('lineHeight').addEventListener('input', function (event) { setGlobal({ lineHeight: Number(event.target.value) }); });
    $('letterSpacing').addEventListener('input', function (event) { setGlobal({ letterSpacing: Number(event.target.value) }); });
    $('inkColor').addEventListener('input', function (event) { setGlobal({ ink: event.target.value }); });
    $('accentColor').addEventListener('input', function (event) { setGlobal({ accent: event.target.value }); });

    $('padSeg').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-pad]');
      if (btn) { setGlobal({ pad: btn.dataset.pad }, true); }
    });

    document.querySelectorAll('.template-card').forEach(function (card) {
      card.addEventListener('click', function () { applyTemplate(card.dataset.template); });
    });

    $('resetGlobalBtn').addEventListener('click', function () {
      if (!window.confirm('恢复默认排版？段落上的单独微调会被清除。')) { return; }
      Array.prototype.forEach.call(paper.querySelectorAll('[data-role]'), function (el) { el.removeAttribute('style'); });
      styleState = normalizeGlobal(DEFAULT_GLOBAL);
      applyGlobal();
      syncGlobalControls();
      syncBlockPanel();
      commitHistory();
      saveNow();
      toast('已恢复默认排版');
    });

    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () { setTab(tab.dataset.tab); });
    });

    $('panelClose').addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);
    $('styleToggle').addEventListener('click', function () {
      if (currentBlock && activeTab === 'global') { setTab('block'); }
      openPanel();
    });

    $('blockFont').addEventListener('change', function (event) {
      setBlockStyle('font-family', event.target.value ? FONTS[event.target.value].stack : '');
    });
    $('blockSize').addEventListener('change', function (event) {
      var value = Number(event.target.value);
      setBlockStyle('font-size', isFinite(value) && value ? clampNumber(value, 10, 36, 14) + 'px' : '');
    });
    $('blockWeight').addEventListener('change', function (event) {
      setBlockStyle('font-weight', event.target.value);
    });
    $('blockItalic').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-italic]');
      if (btn) { setBlockStyle('font-style', btn.dataset.italic === 'italic' ? 'italic' : 'normal'); }
    });
    $('blockAlign').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-align]');
      if (btn) { setBlockStyle('text-align', btn.dataset.align); }
    });
    $('blockLineHeight').addEventListener('change', function (event) {
      var value = Number(event.target.value);
      setBlockStyle('line-height', isFinite(value) && value ? String(clampNumber(value, 1, 3, 1.65)) : '');
    });
    $('blockLetterSpacing').addEventListener('change', function (event) {
      var value = Number(event.target.value);
      setBlockStyle('letter-spacing', isFinite(value) ? value + 'px' : '');
    });
    $('blockColor').addEventListener('input', function (event) {
      setBlockStyle('color', event.target.value);
    });
    $('blockColorClear').addEventListener('click', function () {
      setBlockStyle('color', '');
    });
    $('blockClear').addEventListener('click', function () {
      if (!currentBlock) { return; }
      currentBlock.removeAttribute('style');
      syncBlockPanel();
      markDirty();
      toast('已清除这一段的单独样式');
    });

    $('addGrid').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-add]');
      if (btn) { addSection(btn.dataset.add); }
    });

    $('moduleList').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-ma]');
      if (!btn) { return; }
      var index = Number(btn.dataset.index);
      var sections = paper.querySelectorAll('.section');
      var section = sections[index];
      if (!section) { return; }
      if (btn.dataset.ma === 'focus') { focusSection(index); return; }
      if (btn.dataset.ma === 'up') { moveSection(section, -1); return; }
      if (btn.dataset.ma === 'down') { moveSection(section, 1); return; }
      if (btn.dataset.ma === 'delete') { deleteSection(section); return; }
    });

    $('importBtn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) { return; }
      file.text().then(function (text) {
        var data;
        try { data = JSON.parse(text); } catch (err) { throw new Error('JSON 格式不正确'); }
        if (!window.confirm('导入会覆盖当前简历，是否继续？')) { return; }
        importData(data);
      }).catch(function (err) {
        toast('导入失败：' + (err && err.message ? err.message : '未知错误'));
      });
    });

    $('exportMenuBtn').addEventListener('click', function (event) {
      event.stopPropagation();
      var open = exportMenu.hidden;
      exportMenu.hidden = !open;
      $('exportMenuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    exportMenu.addEventListener('click', function (event) {
      var item = event.target.closest('button');
      if (!item) { return; }
      closeMenu();
      if (item.dataset.export === 'json') { exportJSON(); return; }
      if (item.dataset.export === 'html') { exportHTML(); return; }
      if (item.dataset.action === 'reset') { resetToDemo(); }
    });

    document.addEventListener('click', function (event) {
      if (!event.target.closest('.menu-wrap')) { closeMenu(); }
    });

    $('printBtn').addEventListener('click', exportPDF);

    $('zoomOut').addEventListener('click', function () {
      zoomMode = 'manual';
      applyZoom(zoomValue - 0.1);
    });
    $('zoomIn').addEventListener('click', function () {
      zoomMode = 'manual';
      applyZoom(zoomValue + 0.1);
    });
    $('zoomLabel').addEventListener('click', function () {
      zoomMode = 'manual';
      applyZoom(1);
    });
    $('zoomFit').addEventListener('click', function () { setZoomMode('fit'); });
  }

  function bindKeys() {
    document.addEventListener('keydown', function (event) {
      var target = event.target;
      var isField = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
      var meta = event.ctrlKey || event.metaKey;

      if (isField) { return; }

      if (meta && event.key.toLowerCase() === 'z') {
        event.preventDefault();
        if (event.shiftKey) { redo(); } else { undo(); }
        return;
      }
      if (meta && event.key.toLowerCase() === 'y') {
        event.preventDefault();
        redo();
        return;
      }
      if (meta && event.key.toLowerCase() === 's') {
        event.preventDefault();
        saveNow();
        toast('所有修改已自动保存');
        return;
      }
      if (event.key === 'Escape') {
        closeMenu();
        if (isMobilePanel()) { closePanel(); }
        if (document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-role]')) {
          document.activeElement.blur();
        }
      }
    });
  }

  function bindResize() {
    var frame = 0;
    function schedule() {
      if (zoomMode !== 'fit') { return; }
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(fitZoom);
    }
    window.addEventListener('resize', schedule);
    if (window.ResizeObserver) {
      new ResizeObserver(schedule).observe(stage);
    }
  }

  /* ================================================================
   * 工作台桥接：被 /resume-editor/:id 内嵌时，父页面把简历文档推进来
   * ================================================================ */
  function bindHostBridge() {
    if (!document.documentElement.classList.contains('embed')) { return; }
    var origin = location.origin;
    window.addEventListener('message', function (event) {
      if (event.origin !== origin) { return; }
      var data = event.data || {};
      if (data.type !== 'nova:editor:load' || !data.document || typeof data.document.html !== 'string') { return; }
      if (typeof data.storageKey === 'string' && data.storageKey) { activeKey = data.storageKey; }
      if (!data.document.html) { toast('这份简历没有解析出正文，请重新上传'); return; }
      applyDocument(data.document, { resetHistory: true });
      activeKey = data.storageKey || activeKey;
      saveNow();
      toast('已载入简历：' + resumeName());
    });
    // 父页面要保存时，把当前编辑结果交出去（html 存档 + text 落库）
    window.addEventListener('message', function (event) {
      if (event.origin !== origin) { return; }
      var data = event.data || {};
      if (data.type !== 'nova:editor:request-document') { return; }
      try {
        window.parent.postMessage({
          type: 'nova:editor:document',
          requestId: data.requestId || '',
          html: cleanHTML(),
          text: resumePlainText(),
          title: resumeName()
        }, origin);
      } catch (err) { /* ignore */ }
    });
    try { window.parent.postMessage({ type: 'nova:editor:ready' }, origin); } catch (err) { /* ignore */ }
  }

  /* ================================================================
   * 初始化
   * ================================================================ */
  function init() {
    populateFontSelects();
    renderAddGrid();
    bindChrome();
    bindKeys();
    bindResize();
    bindHostBridge();

    var saved = loadSaved();
    applyDocument(saved || { html: DEFAULT_HTML, global: DEFAULT_GLOBAL }, { resetHistory: true });
    closeMenu();
    setTab('global');

    if (!saved) { saveNow(); } else { setSaveState('saved'); }

    requestAnimationFrame(function () {
      fitZoom();
      requestAnimationFrame(fitZoom);
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { if (zoomMode === 'fit') { fitZoom(); } }).catch(function () {});
    }
  }

  window.addEventListener('beforeunload', function () {
    try { saveNow(); } catch (err) { /* ignore */ }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      try { saveNow(); } catch (err) { /* ignore */ }
    }
  });

  /* 供宿主页面调用：NovaResumeEditor.load({html, global}) */
  window.NovaResumeEditor = {
    getState: function () { return buildState(); },
    load: function (data) {
      if (typeof data === 'string') { data = { html: data }; }
      flushCommit();
      applyDocument(data || { html: DEFAULT_HTML, global: DEFAULT_GLOBAL }, { resetHistory: false });
      commitHistory();
      saveNow();
      toast('已载入简历');
    },
    reset: function () {
      flushCommit();
      applyDocument({ html: DEFAULT_HTML, global: DEFAULT_GLOBAL }, { resetHistory: false });
      commitHistory();
      saveNow();
    },
    setZoom: function (value) {
      zoomMode = 'manual';
      applyZoom(value);
    }
  };

  init();
})();
</script>
</body>
</html>
