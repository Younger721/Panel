# Panel 本地依赖（最小集）
#
# 默认复用本机已在运行的中间件（通常就是 GymMind 那套 gymmind-* 容器）：
#   Redis   localhost:6379    会话 / 异步任务队列
#   ES      localhost:9202    关键词检索（索引 panel-knowledge）
#   MinIO   localhost:9000    对象存储（bucket panel-ai）
#   Milvus  localhost:19530   向量检索（collection panel_knowledge）
#   MySQL   localhost:3306    库 panel_ai（宿主机安装）
# 两套服务靠命名空间隔离（panel:… / gymmind:…，索引、collection、bucket 均不同名），
# 因此这里只保留 Panel 独有的 Kafka，不再重复起一套 Redis/ES/MinIO/Milvus。
services:
  # Kafka 3.9.1 - KRaft 单节点（无 ZooKeeper）：任务分发与进度事件
  kafka:
    image: apache/kafka:3.9.1
    container_name: panel-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # 可选：容器内 MySQL（默认关闭，本机已有 MySQL 时用 USE_DOCKER_MYSQL=0）
  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: panel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required when USE_DOCKER_MYSQL=1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-panel_ai}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  kafka_data:
  mysql_data:
