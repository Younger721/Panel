# 本地全栈开发（唯一推荐 profile：dev）
# 前置：本机 MySQL + start-infrastructure.bat 拉起 Redis/ES/Milvus/MinIO
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nova_ai}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_HOST_PORT:6379}
  kafka:
    bootstrap-servers: ${NOVA_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

platform-admin:
  email: ${PLATFORM_ADMIN_EMAIL:admin@nova.local}
  username: ${PLATFORM_ADMIN_USERNAME:admin}
  password: ${PLATFORM_ADMIN_PASSWORD:123456}
  force-password-sync: ${PLATFORM_ADMIN_FORCE_PASSWORD_SYNC:false}

nova:
  environment: dev
  dev:
    reset-demo-password: ${NOVA_RESET_DEMO_PASSWORD:false}
  job-queue: ${NOVA_JOB_QUEUE:redis}
  kafka:
    job-topic: ${NOVA_KAFKA_JOB_TOPIC:nova.async.job.ready}
    dlq-topic: ${NOVA_KAFKA_DLQ_TOPIC:nova.async.job.dlq}
    consumer-group: ${NOVA_KAFKA_CONSUMER_GROUP:nova-ingest-workers}
  object-store: minio
  object-store.minio-endpoint: ${NOVA_OBJECT_STORE_MINIO_ENDPOINT:http://localhost:9000}
  object-store.minio-access-key: ${NOVA_OBJECT_STORE_MINIO_ACCESS_KEY:minioadmin}
  object-store.minio-secret-key: ${NOVA_OBJECT_STORE_MINIO_SECRET_KEY:minioadmin123}
  object-store.minio-bucket: ${NOVA_OBJECT_STORE_MINIO_BUCKET:nova-ai}
  search:
    keyword-backend: elasticsearch
    vector-backend: milvus
    elasticsearch-url: ${NOVA_ES_URL:http://localhost:9202}
    milvus-url: ${NOVA_MILVUS_URL:http://localhost:19530}
    recover-published: ${NOVA_SEARCH_RECOVER_PUBLISHED:false}
    recover-incomplete-ingest: ${NOVA_SEARCH_RECOVER_INCOMPLETE_INGEST:true}
    recover-index-on-start: ${NOVA_SEARCH_RECOVER_INDEX_ON_START:false}
    require-dual-recall: ${NOVA_SEARCH_REQUIRE_DUAL_RECALL:false}
  knowledge:
    ingest:
      two-phase: ${NOVA_KNOWLEDGE_INGEST_TWO_PHASE:true}
      max-attempts: ${NOVA_KNOWLEDGE_INGEST_MAX_ATTEMPTS:5}
      retry-base-seconds: ${NOVA_KNOWLEDGE_INGEST_RETRY_BASE_SECONDS:30}
      lease-minutes: ${NOVA_KNOWLEDGE_INGEST_LEASE_MINUTES:5}
      markdown-normalization:
        enabled: ${NOVA_KNOWLEDGE_MD_NORMALIZATION:true}
