# 可选：容器化部署（换机器 / 扩容 / 迁移到托管中间件时用）
# 单机起步优先用 systemd + apt，见 docs/部署与升级-运行手册.md §1.1
#
# 用法：
#   cp env/panel.env.example .env && 编辑
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 前提：先构建 backend/target/panel-backend-*.jar（本地 mvn package）

name: panel

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-panel_ai}
      MYSQL_USER: ${MYSQL_USER:-panel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-panel}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 900M
    # 不对宿主机暴露端口，只在 panel 网络内可达
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 320M
    expose:
      - "6379"

  backend-blue:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: panel-backend:${PANEL_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SHUTDOWN: graceful
    volumes:
      - panel_data:/opt/panel/data
      - panel_logs:/opt/panel/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1600M

  # 蓝绿：发布时把新镜像起在 green，健康后把 nginx 的 upstream 指过去。
  # 未发布时保持 0 副本；需要时 `docker compose up -d --scale backend-green=1`。
  backend-green:
    profiles: ["green"]
    image: panel-backend:${PANEL_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SHUTDOWN: graceful
    volumes:
      - panel_data:/opt/panel/data
      - panel_logs:/opt/panel/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1600M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/panel.container.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/panel-upstream.container.conf:/etc/nginx/panel-upstream.conf:ro
      - panel_web:/var/www/panel:ro
      - certs:/etc/letsencrypt:ro
    depends_on:
      - backend-blue

volumes:
  mysql_data:
  panel_data:
  panel_logs:
  panel_web:
  certs:
