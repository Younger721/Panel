# /etc/nginx/sites-available/panel
# 用法：
#   1) 把本文件软链到 sites-enabled
#   2) /etc/nginx/panel-upstream.conf 由 deploy/scripts/switch-upstream.sh 生成
#   3) nginx -t && systemctl reload nginx

# 注册/登录接口的 Nginx 层粗粒度限流（应用层还有 Redis 精确计数，两层都要）
limit_req_zone $binary_remote_addr zone=panel_auth:10m rate=10r/m;
limit_req_status 429;

upstream panel_backend {
    include /etc/nginx/panel-upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /var/www/panel/current;
    index index.html;

    # 对齐 spring.servlet.multipart.max-request-size=40MB
    client_max_body_size 40m;
    client_body_timeout 60s;

    # 简历里有个人信息，禁止被中间层缓存
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA 路由回落；index.html 不缓存，避免发版后用户拿到旧壳
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 注册/登录：单独限流，避免被脚本刷爆
    location ~ ^/api/v1/auth/(signup|login|resend-verification|verify-email)$ {
        limit_req zone=panel_auth burst=5 nodelay;
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API：SSE 必须关缓冲，否则前端"等全部生成完才一次性出现"
    location /api/ {
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # 实时语音识别 WebSocket
    location /ws/ {
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /actuator/health {
        proxy_pass http://panel_backend;
        access_log off;
    }

    # 健康检查与内部端点不对公网暴露
    location /actuator/ {
        deny all;
    }
}

