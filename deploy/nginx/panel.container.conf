# 容器版的 Nginx 站点配置（/etc/nginx/conf.d/default.conf）
# 与主机版 deploy/nginx/panel.conf 等价，区别只有 upstream 走 compose 服务名。

limit_req_zone $binary_remote_addr zone=panel_auth:10m rate=10r/m;
limit_req_status 429;

upstream panel_backend {
    include /etc/nginx/panel-upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /var/www/panel/current;
    index index.html;
    client_max_body_size 40m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/v1/auth/(signup|login|resend-verification|verify-email)$ {
        limit_req zone=panel_auth burst=5 nodelay;
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /ws/ {
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /actuator/health {
        proxy_pass http://panel_backend;
        access_log off;
    }

    location /actuator/ {
        deny all;
    }
}
